<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice — Skill Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0E14;
    --panel: #111827;
    --panel-2: #0D1420;
    --line: #1F2937;
    --line-bright: #2C374A;
    --text: #E7ECF3;
    --muted: #7C8798;
    --teal: #5EEAD4;
    --amber: #F0A857;
    --red: #F26D6D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .display { font-family: 'Space Grotesk', sans-serif; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
  }
  .brand a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; }
  .brand a:hover { color: var(--text); }
  .brand .sep { color: var(--line-bright); }
  .mode-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    border: 1px solid rgba(240,168,87,0.35);
    background: rgba(240,168,87,0.08);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* ---------- layout ---------- */
  .layout { display: flex; height: calc(100vh - 57px); }

  /* sidebar */
  .sidebar {
    width: 360px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }
  .filters {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .filters .search {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
    font-family: 'Inter', sans-serif;
  }
  .filters .search:focus { outline: none; border-color: var(--line-bright); }
  .diff-tabs { display: flex; gap: 6px; }
  .diff-tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    flex: 1;
    text-align: center;
  }
  .diff-tab.active { border-color: var(--line-bright); color: var(--text); background: var(--panel-2); }

  .problem-list { flex: 1; overflow-y: auto; padding: 8px; }
  .problem-item {
    padding: 13px 12px;
    border-radius: 7px;
    cursor: pointer;
    margin-bottom: 3px;
    border: 1px solid transparent;
  }
  .problem-item:hover { background: var(--panel-2); }
  .problem-item.active { background: rgba(94,234,212,0.06); border-color: rgba(94,234,212,0.3); }
  .problem-item .title { font-size: 13.5px; font-weight: 500; margin-bottom: 5px; }
  .problem-item .meta { display: flex; align-items: center; gap: 8px; }
  .diff-dot { width: 6px; height: 6px; border-radius: 50%; }
  .diff-dot.Easy { background: var(--teal); }
  .diff-dot.Medium { background: var(--amber); }
  .diff-dot.Hard { background: var(--red); }
  .problem-item .topics {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .list-empty { color: var(--muted); font-size: 13px; padding: 24px 12px; text-align: center; }

  /* main panel */
  .main-panel { flex: 1; overflow-y: auto; }
  .placeholder {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 10px;
  }
  .placeholder .mark {
    width: 40px; height: 40px;
    display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 3px;
    opacity: 0.5;
  }
  .placeholder .mark span { background: var(--line-bright); border-radius: 2px; }

  .problem-view { max-width: 880px; margin: 0 auto; padding: 40px 40px 80px; }
  .problem-header { margin-bottom: 8px; }
  .problem-header .badge-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .diff-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
  }
  .diff-badge.Easy { background: rgba(94,234,212,0.1); color: var(--teal); }
  .diff-badge.Medium { background: rgba(240,168,87,0.1); color: var(--amber); }
  .diff-badge.Hard { background: rgba(242,109,109,0.1); color: var(--red); }
  .topic-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--line-bright);
    padding: 4px 9px;
    border-radius: 4px;
  }
  .problem-view h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .problem-desc {
    color: #C5CCD9;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    margin-bottom: 28px;
  }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }

  .test-case {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  .test-case .row { display: flex; gap: 8px; margin-bottom: 4px; }
  .test-case .row:last-child { margin-bottom: 0; }
  .test-case .k { color: var(--muted); flex-shrink: 0; }
  .test-case .v { color: var(--text); word-break: break-word; }

  /* editor */
  .editor-block { margin-top: 32px; }
  .editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .lang-tabs { display: flex; gap: 4px; }
  .lang-tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .lang-tab.active { color: var(--text); border-color: var(--line-bright); background: var(--panel-2); }

  textarea.code-editor {
    width: 100%;
    height: 280px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.6;
    resize: vertical;
  }
  textarea.code-editor:focus { outline: none; border-color: var(--line-bright); }
  textarea.code-editor::placeholder { color: var(--muted); }

  .run-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .btn-run {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    padding: 11px 22px;
    background: var(--teal);
    color: #06201C;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-run:hover { filter: brightness(1.1); }
  .btn-run:disabled { opacity: 0.5; cursor: default; }
  .run-hint { font-size: 12.5px; color: var(--muted); }

  .note-box {
    margin-top: 18px;
    background: rgba(240,168,87,0.06);
    border: 1px solid rgba(240,168,87,0.25);
    border-left: 3px solid var(--amber);
    padding: 11px 14px;
    font-size: 12.5px;
    color: #D9B78A;
    border-radius: 4px;
  }

  .result-summary {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid;
  }
  .result-summary.pass { background: rgba(94,234,212,0.08); border-color: rgba(94,234,212,0.3); color: var(--teal); }
  .result-summary.fail { background: rgba(242,109,109,0.08); border-color: rgba(242,109,109,0.3); color: var(--red); }

  .result-case {
    border: 1px solid var(--line);
    border-left: 3px solid var(--line-bright);
    border-radius: 8px;
    padding: 13px 16px;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--panel-2);
  }
  .result-case.pass { border-left-color: var(--teal); }
  .result-case.fail { border-left-color: var(--red); }
  .result-case .label { font-size: 11px; margin-bottom: 6px; letter-spacing: 0.02em; }
  .result-case.pass .label { color: var(--teal); }
  .result-case.fail .label { color: var(--red); }
  .result-case .row { display: flex; gap: 8px; margin-bottom: 3px; }
  .result-case .k { color: var(--muted); flex-shrink: 0; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; height: auto; }
    .sidebar { width: 100%; max-height: 300px; }
    .problem-view { padding: 24px 20px 60px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <a href="/">Skill Matrix</a>
    <span class="sep">/</span>
    <span style="color: var(--text);">Practice</span>
  </div>
  <div class="mode-pill">SELF-PACED · NO TIMER</div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="filters">
      <input class="search mono" id="topicFilter" placeholder="Filter by topic (e.g. Array, Hash Table)…" />
      <div class="diff-tabs" id="diffTabs">
        <button class="diff-tab active" data-diff="">All</button>
        <button class="diff-tab" data-diff="Easy">Easy</button>
        <button class="diff-tab" data-diff="Medium">Medium</button>
        <button class="diff-tab" data-diff="Hard">Hard</button>
      </div>
    </div>
    <div class="problem-list" id="problemList"></div>
  </div>

  <div class="main-panel" id="mainPanel">
    <div class="placeholder">
      <div class="mark"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="mono" style="font-size:13px;">Select a problem to begin</div>
    </div>
  </div>
</div>

<script>
let currentProblems = [];
let currentProblemId = null;
let currentDifficulty = '';

async function loadProblems() {
  const topic = document.getElementById('topicFilter').value.trim();
  let url = '/api/practice/problems?limit=60';
  if (currentDifficulty) url += `&difficulty=${encodeURIComponent(currentDifficulty)}`;
  if (topic) url += `&topic=${encodeURIComponent(topic)}`;

  const res = await fetch(url);
  const data = await res.json();
  currentProblems = data.problems;
  renderList();
}

function renderList() {
  const listEl = document.getElementById('problemList');
  if (currentProblems.length === 0) {
    listEl.innerHTML = '<div class="list-empty">No problems match your filters.</div>';
    return;
  }
  listEl.innerHTML = currentProblems.map(p => `
    <div class="problem-item" onclick="loadProblem('${p.problem_id}')" id="item-${p.problem_id}">
      <div class="title">${p.title}</div>
      <div class="meta">
        <span class="diff-dot ${p.difficulty}"></span>
        <span class="topics">${p.difficulty} · ${p.topics.slice(0,2).join(', ')}</span>
      </div>
    </div>
  `).join('');
}

async function loadProblem(problemId) {
  document.querySelectorAll('.problem-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`item-${problemId}`)?.classList.add('active');
  currentProblemId = problemId;

  const res = await fetch(`/api/practice/problem/${problemId}`);
  const p = await res.json();

  const testCasesHtml = p.test_cases.map((tc, i) => `
    <div class="test-case">
      <div class="row"><span class="k">in</span><span class="v">${tc.input}</span></div>
      <div class="row"><span class="k">out</span><span class="v">${tc.output}</span></div>
    </div>
  `).join('');

  document.getElementById('mainPanel').innerHTML = `
    <div class="problem-view">
      <div class="problem-header">
        <div class="badge-row">
          <span class="diff-badge ${p.difficulty}">${p.difficulty}</span>
          ${p.topics.map(t => `<span class="topic-chip">${t}</span>`).join('')}
        </div>
        <h1>${p.title}</h1>
      </div>
      <div class="problem-desc">${p.description}</div>

      <div class="section-label">TEST CASES</div>
      ${testCasesHtml}

      <div class="editor-block">
        <div class="editor-toolbar">
          <div class="lang-tabs" id="langTabs">
            <button class="lang-tab active" data-lang="python">Python</button>
            <button class="lang-tab" data-lang="javascript">JavaScript</button>
            <button class="lang-tab" data-lang="java">Java</button>
            <button class="lang-tab" data-lang="cpp">C++</button>
          </div>
        </div>
        <textarea class="code-editor mono" id="codeEditor" placeholder="# print your final answer — variables from the test case are set for you above
"></textarea>
        <div class="run-row">
          <button class="btn-run" onclick="checkSolution()">Run Test Cases</button>
          <span class="run-hint">Only Python is auto-checked right now</span>
        </div>
        <div class="note-box">
          Print your final answer with <code>print(result)</code> instead of returning it — the test case's input variables are injected automatically before your code runs.
        </div>
        <div id="checkResult"></div>
      </div>
    </div>
  `;

  document.querySelectorAll('#langTabs .lang-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#langTabs .lang-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });
}

function getSelectedLanguage() {
  const active = document.querySelector('#langTabs .lang-tab.active');
  return active ? active.dataset.lang : 'python';
}

async function checkSolution() {
  const code = document.getElementById('codeEditor').value;
  const language = getSelectedLanguage();
  const resultEl = document.getElementById('checkResult');

  if (!code.trim()) {
    resultEl.innerHTML = '<div class="result-summary fail">Write some code first.</div>';
    return;
  }

  resultEl.innerHTML = '<div class="result-summary" style="color:var(--muted); border-color:var(--line);">Running…</div>';

  const res = await fetch('/api/practice/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ problem_id: currentProblemId, code, language })
  });
  const data = await res.json();

  if (data.error) {
    resultEl.innerHTML = `<div class="result-summary fail">${data.error}</div>`;
    return;
  }

  const passClass = data.all_passed ? 'pass' : 'fail';
  let html = `<div class="result-summary ${passClass}">${data.passed_tests} / ${data.total_tests} test cases passed</div>`;

  data.results.forEach((r, i) => {
    const cls = r.passed ? 'pass' : 'fail';
    html += `
      <div class="result-case ${cls}">
        <div class="label">TEST ${i + 1} — ${r.passed ? 'PASSED' : 'FAILED'}</div>
        <div class="row"><span class="k">in</span><span>${r.input}</span></div>
        <div class="row"><span class="k">expected</span><span>${r.expected}</span></div>
        <div class="row"><span class="k">got</span><span>${r.actual}</span></div>
      </div>
    `;
  });

  resultEl.innerHTML = html;
}

document.getElementById('topicFilter').addEventListener('input', () => {
  clearTimeout(window._topicDebounce);
  window._topicDebounce = setTimeout(loadProblems, 300);
});

document.querySelectorAll('#diffTabs .diff-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#diffTabs .diff-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentDifficulty = tab.dataset.diff;
    loadProblems();
  });
});

loadProblems();
</script>

</body>
</html>
